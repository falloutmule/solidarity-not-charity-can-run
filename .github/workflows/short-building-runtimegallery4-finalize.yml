name: Finalize Runtimegallery4 Short-Building Artifact

on:
  push:
    branches:
      - integration/short-building-renderer-runtimegallery4

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v5
        with:
          ref: integration/short-building-renderer-runtimegallery4
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set combined candidate BUILD_ID
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/js/game-06-section-2b-mobile-touch-input.js';
          const before = "var BUILD_ID = 'runtimegallery4'; window.BUILD_ID = BUILD_ID;";
          const after = "var BUILD_ID = 'runtimegallery4short1'; window.BUILD_ID = BUILD_ID;";
          const source = fs.readFileSync(file, 'utf8');
          const count = source.split(before).length - 1;
          if (count === 0 && source.includes(after)) {
            console.log('BUILD_ID already updated.');
            process.exit(0);
          }
          if (count !== 1) throw new Error(`expected exactly one runtimegallery4 BUILD_ID source line, found ${count}`);
          fs.writeFileSync(file, source.replace(before, after), 'utf8');
          NODE

      - name: Generate review artifact
        run: npm run build

      - name: Verify generated artifact
        run: node tools/build-single-file.js --check

      - name: Commit source identity and generated artifact to review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/game-06-section-2b-mobile-touch-input.js index.html project-metadata.json
          if git diff --cached --quiet; then
            echo "Source and generated artifact already match."
            exit 0
          fi
          git commit -m "Set runtimegallery4short1 candidate identity"
          git push origin HEAD:integration/short-building-renderer-runtimegallery4
